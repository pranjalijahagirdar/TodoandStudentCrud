<h1 class="bg-info text-white text-center mt-3 p-2">Todo Crud</h1>
<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card p-3">
                <h1 class="text-center w-100 mb-4">
                    {{isInEditMode ? 'Update Todo': 'Add Todo'}}
                </h1>
                <div class="mb-3">
                    <label for="title">Todo Title</label>
                    <input #todoRef type="text" class="form-control" placeholder="Enter Todo Item">
                </div>
                <div class="form-group">
                    <label for="isCompleted">Is Completed</label>
                    <select class="form-control" #isCompletedRef>
                        <option value="yes">completed</option>
                        <option value="no">In Completed</option>
                    </select>
                </div>
                <div class="text-center">
                    <button (click)="onTodoAdd()" *ngIf="!isInEditMode" class="btn btn-primary btn-lg">Add Todo</button>
                    <button (click)="onUpdateTodo()" *ngIf="isInEditMode" class="btn btn-info btn-lg">Update Todo</button>
                </div>
            </div>
            </div>
            <div class="col-md-5 mt-3 mb-3 ">
                <div class="card">
                    <ul class="list-group list-group-flush" *ngIf="TodosArr.length > 0; else noTodo">
                        <li class="list-group-item d-flex align-items-center" *ngFor="let todo of TodosArr">
                            <input type="checkbox" [checked]="todo.isCompleted" (change)="onChange(todo)" class="mr-2">
                            <strong>
                                {{todo.title}}
                            </strong>
                            <small class="badge ml-3 mr-3" [ngClass]="{
                                'badge-success':todo.isCompleted,
                                'badge-danger':!todo.isCompleted
                            }">
                                {{todo.isCompleted ? 'Completed': 'In Completed'}}
                            </small>
                            <div class="ml-auto d-flex align-items-center">
                                <button mat-mini-fab mr -2 color="primary" 
                            (click)="onTodoEdit(todo)" 
                                >
                             <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-mini-fab color="warn" (click)="onTodoRemove(todo.id)" [disabled]="updateId===todo.id">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                        </li>
                    </ul>
                    <ng-template #noTodo>
                        <p class="text-center text-info mt-3">
                            No Todo Added yet !!!
                        </p>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
